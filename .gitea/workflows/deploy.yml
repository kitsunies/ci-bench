name: Bench Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: optiplex
    steps:
      - uses: actions/checkout@v4
      - name: Log into Gitea Container Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ vars.REGISTRY_HOST }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Build and push image
        run: |
          TAG=${{ vars.REGISTRY_HOST }}/tommy/ci-bench:${{ gitea.sha }}
          LATEST=${{ vars.REGISTRY_HOST }}/tommy/ci-bench:latest
          docker build -t $TAG -t $LATEST .
          docker push $TAG
          docker push $LATEST
