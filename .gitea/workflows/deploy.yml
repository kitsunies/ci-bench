name: Bench Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log into Gitea Container Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.gitea:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Build and push image
        run: |
          TAG=gitea-http.gitea:3000/tommy/ci-bench:${{ gitea.sha }}
          LATEST=gitea-http.gitea:3000/tommy/ci-bench:latest
          docker build -t $TAG -t $LATEST .
          docker push $TAG
          docker push $LATEST
